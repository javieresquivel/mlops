apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: final
  annotations:
    kompose.cmd: /home/javier/Descargas/kompose convert -f docker-compose.yml -o komposefiles2/ --volumes hostPath
    kompose.version: 1.26.0 (40646f47)
  labels:
    io.kompose.service: locust
  name: locust
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: locust
  template:
    metadata:
      annotations:
        kompose.cmd: /home/javier/Descargas/kompose convert -f docker-compose.yml -o komposefiles2/ --volumes hostPath
        kompose.version: 1.26.0 (40646f47)
      labels:
        io.kompose.service: locust
    spec:
      containers:
        - env:
            - name: LOCUST_HOST
              value: http://api:8013
          image: javieresquivel123/proyecto-final-locust:8277f559d8beb99084af869213bab317b209f2b9
          imagePullPolicy: Always
          name: locust
          ports:
            - containerPort: 8089
              protocol: TCP
      restartPolicy: Always
