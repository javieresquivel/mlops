apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: final
  annotations:
    kompose.cmd: /home/javier/Descargas/kompose convert -f docker-compose.yml -o komposefiles2/ --volumes hostPath
    kompose.version: 1.26.0 (40646f47)
  labels:
    io.kompose.service: grafana
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: grafana
  template:
    metadata:
      annotations:
        kompose.cmd: /home/javier/Descargas/kompose convert -f docker-compose.yml -o komposefiles2/ --volumes hostPath
        kompose.version: 1.26.0 (40646f47)
      labels:
        io.kompose.service: grafana
    spec:
      containers:
        - env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          image: javieresquivel123/proyecto-final-grafana:fb5d4fd567c3f5ed2c7d0befb742b84474484aed
          imagePullPolicy: Always
          name: grafana
          resources:
            requests:
              cpu: "500m"      # Reserva 0.25 CPUs
              memory: "300Mi"    # Reserva 64 Megabytes
            limits:
              cpu: "2"         # Máximo 1 CPU
              memory: "1000Mi"
          ports:
            - containerPort: 3000
              protocol: TCP
      restartPolicy: Always
