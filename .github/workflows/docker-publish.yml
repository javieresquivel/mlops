name: Build and Push Docker Images

on:
  push:
    branches:
      - main  # O la rama que uses por defecto
    paths:
      - 'proyecto_final/api/**'
      - 'proyecto_final/locust/**'
      - 'proyecto_final/mlflow/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    strategy:
      # matrix permite ejecutar el mismo job en paralelo para diferentes carpetas
      matrix:
        service: [api, locust, mlflow]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          # Apunta correctamente a la subcarpeta dentro de proyecto_final
          context: ./proyecto_final/${{ matrix.service }}
          file: ./proyecto_final/${{ matrix.service }}/Dockerfile
          push: true
          # Publicará en Docker Hub como: tu_usuario/api:latest, tu_usuario/locust:latest, etc.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-final-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-final-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max